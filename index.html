<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<body>

    <div class="container">

        <h1>Expense Tracker</h1>
        <p>Keep track of your daily spending</p>

        <div class="form">

            <input type="text" id="description"
                placeholder="e.g. Lunch with friends">

            <input type="number" id="amount"
                placeholder="0.00">

            <select id="category">
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">💡 Bills</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

        </div>

        <div class="filter">
            <label>Filter by Category:</label>

            <select id="filter" onchange="showExpenses()">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
            </select>
        </div>

        <div id="expenseList">
            <p class="empty">📝 Nothing yet. Add your first expense above!</p>
        </div>

        <div class="bottom">
            <span id="count">0 expenses</span>
            <span>Total: $<b id="total">0.00</b></span>
        </div>

    </div>
     <div class="student-reference">
    💡 <strong>Student Reference:</strong>
    Built with 3 files — index.html, styles.css, and app.js.
    No frameworks, no build tools!
</div>


    <script src="script.js"></script>

</body>
</html>
</body>
</html>
